<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Designpipe 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-0: #fafafa;
        --bg-1: #f4f4f6;
        --bg-2: #ececef;
        --bg-3: #e0e0e4;
        --tx-1: #111116;
        --tx-2: #38383f;
        --tx-3: #68686f;
        --tx-4: #9898a2;
        --bd-1: #e2e2e8;
        --bd-2: #cacad2;
        --ac: #cc785c;
        --ac-2: #b8654a;
        --ac-line: #e8ad96;
        --ac-soft: #fef5f1;
        --ac-glow: rgba(204,120,92,0.12);
        --ok: #16a34a;
        --ok-soft: #f0fdf4;
        --warn: #d97706;
        --warn-soft: #fffbeb;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: 'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
        --radius-s: 6px;
        --radius-m: 10px;
        --radius-l: 14px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg-0);
        color: var(--tx-1);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { height: 100%; }
      button { font-family: inherit; cursor: pointer; }
      *::-webkit-scrollbar { width: 6px; height: 6px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: var(--bd-1); border-radius: 999px; }
      *::-webkit-scrollbar-thumb:hover { background: var(--bd-2); }
      ::selection { background: var(--ac-soft); color: var(--tx-1); }
      :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 4px; }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: none; }
      }
      .fadeUp { animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }
      @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.8s linear infinite; }
      .mono { font-family: var(--mono); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
