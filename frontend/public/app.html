/* PingFang SC — 转转设计系统字体（本地字体文件，精确渲染苹方字重）*/

@font-face{font-family:"PingFang SC";font-weight:400;src:url("./fonts/PingFangSC-Regular.ttf") format("truetype");font-display:swap;}

<style>
:root {
  /* Refined neutral foundations — cooler, more precise */
  --bg-0: #fafafa;
  --bg-1: #f4f4f6;
  --bg-2: #ececef;
  --bg-3: #e0e0e4;
  --tx-1: #111116;
  --tx-2: #38383f;
  --tx-3: #68686f;
  --tx-4: #9898a2;
  --bd-1: #e2e2e8;
  --bd-2: #cacad2;

  /* Accent — warm terracotta (user-overridable via tweaks) */
  --ac: #cc785c;
  --ac-2: #b8654a;
  --ac-line: #e8ad96;
  --ac-soft: #fef5f1;
  --ac-glow: rgba(204, 120, 92, 0.12);

  /* Semantic tokens */
  --ok: #16a34a;
  --ok-line: #86efac;
  --ok-soft: #f0fdf4;
  --warn: #d97706;
  --warn-line: #fcd34d;
  --warn-soft: #fffbeb;
  --danger: #dc2626;
  --danger-line: #fca5a5;
  --danger-soft: #fef2f2;

  /* Typography */
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, serif;
  --display: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;

  /* Radii */
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 14px;
  --radius-xl: 20px;

  /* Elevation — border-only, no shadows */
  --shadow-xs: none;
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: none;
  --shadow-focus: none;

  /* Density: comfortable */
  --gap-1: 8px;
  --gap-2: 12px;
  --gap-3: 16px;
  --gap-4: 24px;
  --gap-5: 32px;
  --pad-card: 20px;
  --row-h: 44px;
}
[data-density="compact"] {
  --gap-1: 6px;
  --gap-2: 8px;
  --gap-3: 12px;
  --gap-4: 18px;
  --gap-5: 24px;
  --pad-card: 14px;
  --row-h: 36px;
}
[data-font="serif"] {
  --sans: Charter, 'Bitstream Charter', Georgia, serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-0);
  color: var(--tx-1);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}
body { min-height: 100vh; }
#root { min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; }
h1, h2, h3 { text-wrap: balance; }

/* Refined scrollbars */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--bd-1); border-radius: 999px;
  border: 2px solid transparent; background-clip: padding-box;
  transition: background 0.15s;
}
*::-webkit-scrollbar-thumb:hover { background: var(--bd-2); background-clip: padding-box; border: 2px solid transparent; }

/* Typography utilities */
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.display { font-family: var(--display); letter-spacing: -0.02em; }

/* Keyboard shortcut badge */
.kbd {
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 5px;
  border: 1px solid var(--bd-1);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--tx-3);
  background: var(--bg-0);
}

.ac { color: var(--ac); }

/* Typing cursor */
.tcursor::after {
  content: "▍";
  margin-left: 2px;
  color: var(--ac);
  animation: tblink 1.1s steps(1) infinite;
}
@keyframes tblink { 50% { opacity: 0; } }

/* Entrance animation — smoother cubic */
@keyframes fadeUp {
  0%   { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: none; }
}
.fadeUp { animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

/* Stagger helpers */
.fadeUp:nth-child(1) { animation-delay: 0ms; }
.fadeUp:nth-child(2) { animation-delay: 40ms; }
.fadeUp:nth-child(3) { animation-delay: 80ms; }
.fadeUp:nth-child(4) { animation-delay: 120ms; }

@keyframes pulse { 0%,100%{opacity:.45;} 50%{opacity:1;} }
.pulse { animation: pulse 1.6s ease-in-out infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.9s linear infinite; }

/* Shimmer for loading states */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-1) 50%, var(--bg-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s infinite;
}

/* Selection */
::selection { background: var(--ac-soft); color: var(--tx-1); }

/* Focus ring */
:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Smooth interactive transitions */
button, a, [role="button"] {
  transition-property: background-color, color, border-color, box-shadow, transform, opacity;
  transition-duration: 0.15s;
  transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
}

/* Dot-grid background pattern for hero-like surfaces */
.dot-grid {
  background-image: radial-gradient(var(--bd-1) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Glass surface */
.glass {
  background: rgba(250, 250, 250, 0.82);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
}
</style>
</head>

    + '*,*::before,*::after{box-sizing:border-box!important;}'

    + 'function fixImg(img){var w=img.getAttribute("width")||img.offsetWidth||80;var h=img.getAttribute("height")||img.offsetHeight||80;var ph=document.createElement("div");ph.style.cssText="width:"+w+"px;height:"+h+"px;background:#ECECEC;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;";ph.innerHTML=\'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BBBBBB" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>\';if(img.parentNode)img.parentNode.replaceChild(ph,img);}'
    + 'function isDarkBg(bg){var m=bg.match(/rgba?\\((\\d+),\\s*(\\d+),\\s*(\\d+)/);if(m){var r=+m[1],g=+m[2],b=+m[3];return r<60&&g<60&&b<60;}return false;}'
    + 'function killPhoneChrome(){var mi=5;while(mi-->0){var f=document.body.firstElementChild;if(!f)break;var s=window.getComputedStyle(f);var br=parseInt(s.borderRadius)||0;var w=f.offsetWidth;var h=f.offsetHeight;if(isDarkBg(s.backgroundColor)&&br>=20&&w>=350&&h>=600){while(f.firstChild)document.body.insertBefore(f.firstChild,f);f.remove();continue;}if(br>=20&&w>=350&&h>=600&&f.children.length===1){var inner=f.firstElementChild;if(inner&&parseInt(window.getComputedStyle(inner).borderRadius)>=10){while(f.firstChild)document.body.insertBefore(f.firstChild,f);f.remove();continue;}}break;}document.querySelectorAll("*").forEach(function(el){var s=window.getComputedStyle(el);var r=el.getBoundingClientRect();if(!isDarkBg(s.backgroundColor))return;if(r.top<6&&r.width>=200&&r.height<=12)el.style.display="none";if(r.bottom>document.body.offsetHeight-30&&r.width>=60&&r.height<=14)el.style.display="none";});}'

// ── Designpipe Cache (localStorage) ─────────────────────────────────────────
// Persists step data, QA, workflow state across page refreshes.
const DP_CACHE_KEY = "dp_cache_v2";
const DP_STATE_KEY = "dp_wf_state_v2";

window.dpSaveCache = function() {
  try {
    const d = window.DPData;
    // step6.html can be large, compress by keeping only html key
    const step6 = d.step6 ? { html: d.step6.html } : null;
    localStorage.setItem(DP_CACHE_KEY, JSON.stringify({
      step1: d.step1 || null,
      step2: d.step2 || null,
      step3: d.step3 || null,
      step4: d.step4 || null,
      step5: d.step5 || null,
      step6: step6,
      step7: d.step7 || null,
      qa: d.qa || [],
      pageType: d.pageType || null,
    }));
  } catch(e) { console.warn("[DPCache] save failed:", e.message); }
};

window.dpSaveWorkflowState = function(state) {
  try { localStorage.setItem(DP_STATE_KEY, JSON.stringify(state)); } catch {}
};

window.dpLoadWorkflowState = function() {
  try { return JSON.parse(localStorage.getItem(DP_STATE_KEY) || "null"); } catch { return null; }
};

// Project list persistence
const DP_PROJECTS_KEY = "dp_projects_v2";
window.dpSaveProjects = function(projects) {
  try { localStorage.setItem(DP_PROJECTS_KEY, JSON.stringify(projects)); } catch {}
};
window.dpLoadProjects = function() {
  try { return JSON.parse(localStorage.getItem(DP_PROJECTS_KEY) || "null"); } catch { return null; }
};

window.dpClearCache = function() {
  try {
    localStorage.removeItem(DP_CACHE_KEY);
    localStorage.removeItem(DP_STATE_KEY);
    // NOTE: don't clear projects — other projects should survive
  } catch {}
};

// Auto-restore on load
(function() {
  try {
    const raw = localStorage.getItem(DP_CACHE_KEY);
    if (!raw) return;
    const cache = JSON.parse(raw);
    const d = window.DPData;
    if (cache.step1) d.step1 = cache.step1;
    if (cache.step2) d.step2 = cache.step2;
    if (cache.step3) d.step3 = cache.step3;
    if (cache.step4) d.step4 = cache.step4;
    if (cache.step5) d.step5 = cache.step5;
    if (cache.step6) d.step6 = cache.step6;
    if (cache.step7) d.step7 = cache.step7;
    if (cache.qa)    d.qa   = cache.qa;
    if (cache.pageType) d.pageType = cache.pageType;
    console.info("[DPCache] ✅ 已恢复步骤缓存");
  } catch(e) { console.warn("[DPCache] restore failed:", e.message); }
  // Restore projects list (merge with demo project)
  try {
    const savedProjects = JSON.parse(localStorage.getItem(DP_PROJECTS_KEY) || "null");
    if (savedProjects && savedProjects.length) {
      // Keep the demo iphone15 project, merge saved user projects on top
      const demo = window.DPData.projects.find(p => p.id === "iphone15");
      const userProjects = savedProjects.filter(p => p.id !== "iphone15");
      window.DPData.projects = demo ? [demo, ...userProjects] : userProjects;
      console.info("[DPCache] ✅ 已恢复项目列表", window.DPData.projects.length, "个");
    }
  } catch(e) { console.warn("[DPCache] projects restore failed:", e.message); }
})();

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

      style={{

// Typewriter — types text out char by char
function useTypewriter(text, opts = {}) {
  const { speed = 16, enabled = true, onDone } = opts;
  const [shown, setShown] = React.useState(enabled ? "" : text);
  const [done, setDone] = React.useState(!enabled);
  React.useEffect(() => {
    if (!enabled) { setShown(text); setDone(true); return; }
    setShown(""); setDone(false);
    let i = 0;
    const id = setInterval(() => {
      i += Math.max(1, Math.floor(text.length / 80));
      if (i >= text.length) {
        setShown(text); setDone(true); clearInterval(id);
        onDone && onDone();
      } else {
        setShown(text.slice(0, i));
      }
    }, speed);
    return () => clearInterval(id);
  }, [text, enabled]);
  return { shown, done };
}

      fontFamily: "var(--display)", fontWeight: 700, fontSize: size * 0.42,

<script type="text/babel">
// Pipeline — vertical 7-step timeline shown in workflow sidebar

const StepBadge = ({ status, idx, active }) => {
  // status: "done" | "current" | "pending" | "running"
  const map = {
    done:     { bg: "var(--ac)", color: "var(--bg-0)", bd: "var(--ac)" },
    current:  { bg: "var(--bg-1)", color: "var(--ac)", bd: "var(--ac)" },
    running:  { bg: "var(--bg-1)", color: "var(--ac)", bd: "var(--ac)" },
    pending:  { bg: "var(--bg-1)", color: "var(--tx-4)", bd: "var(--bd-1)" },
  };
  const s = map[status];
  return (
    <div style={{
      width: 28, height: 28, borderRadius: 8,
      background: s.bg, color: s.color,
      border: `1.5px solid ${s.bd}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: 12, fontWeight: 600, fontFamily: "var(--mono)",
      flexShrink: 0, position: "relative",
      outline: active ? `2px solid var(--ac)` : "none",
      outlineOffset: 2,
      transition: "outline .2s",
    }}>
      {status === "done" ? <Icon name="check" size={14} /> :
       status === "running" ? <Spinner size={12} /> :
       idx}
    </div>
  );
};

const Pipeline = ({ steps, currentStep, completedStep, runningStep, onSelect }) => {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
      {steps.map((step, i) => {
        const status =
          step.idx === runningStep ? "running" :
          step.idx <= completedStep ? "done" :
          step.idx === currentStep ? "current" :
          "pending";
        const active = step.idx === currentStep;
        const isLast = i === steps.length - 1;
        return (
          <div key={step.idx} style={{ display: "flex", gap: 12, position: "relative" }}>
            {/* Spine */}
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 0 }}>
              <StepBadge status={status} idx={step.idx} active={active} />
              {!isLast && (
                <div style={{
                  width: 2, flex: 1, minHeight: 28,
                  background: step.idx < completedStep
                    ? "var(--ac)"
                    : step.idx === completedStep
                      ? "linear-gradient(180deg, var(--ac), var(--bd-1))"
                      : "var(--bd-1)",
                  margin: "4px 0",
                }} />
              )}
            </div>

            {/* Content */}
            <button
              onClick={() => onSelect(step.idx)}
              style={{
                flex: 1, padding: "2px 12px 22px 0",
                background: "transparent", border: "none",
                textAlign: "left", color: "inherit", cursor: "pointer",
                fontFamily: "inherit",
              }}
            >
              <div style={{
                background: active ? "var(--ac-soft)" : "transparent",
                border: `1px solid ${active ? "var(--ac-line)" : "transparent"}`,
                borderRadius: 10, padding: "8px 12px",
                transition: "all .15s",
              }}
              onMouseEnter={e => { if (!active) e.currentTarget.style.background = "var(--bg-2)"; }}
              onMouseLeave={e => { if (!active) e.currentTarget.style.background = "transparent"; }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                  <span className="mono" style={{ fontSize: 10, color: active ? "var(--ac)" : "var(--tx-4)", letterSpacing: 0.06 }}>
                    STEP 0{step.idx}
                  </span>
                  {status === "done" && <Badge tone="ok" style={{ height: 16, fontSize: 9, padding: "0 5px" }}>已确认</Badge>}
                  {status === "running" && <Badge tone="accent" style={{ height: 16, fontSize: 9, padding: "0 5px" }}>生成中</Badge>}
                  {step.idx === 3 && step.idx === currentStep && <Badge tone="warn" style={{ height: 16, fontSize: 9, padding: "0 5px" }}>需选择</Badge>}
                </div>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: active ? "var(--tx-1)" : "var(--tx-2)" }}>
                  {step.name}
                </div>
                <div style={{ fontSize: 11.5, color: "var(--tx-4)", marginTop: 3, lineHeight: 1.45,
                  display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
                  {step.desc}
                </div>
              </div>
            </button>
          </div>
        );
      })}
    </div>
  );
};

// Horizontal pipeline used in workflow header
const PipelineStrip = ({ steps, currentStep, completedStep, onSelect }) => {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 0, width: "100%" }}>
      {steps.map((step, i) => {
        const status =
          step.idx <= completedStep ? "done" :
          step.idx === currentStep ? "current" :
          "pending";
        const active = step.idx === currentStep;
        const isLast = i === steps.length - 1;
        const isDone = status === "done";
        return (
          <React.Fragment key={step.idx}>
            <button onClick={() => onSelect(step.idx)} style={{
              display: "flex", alignItems: "center", gap: 8,
              padding: "5px 10px", borderRadius: 8,
              background: active ? "var(--ac-soft)" : "transparent",
              border: `1px solid ${active ? "var(--ac-line)" : "transparent"}`,
              color: "inherit", cursor: "pointer", fontFamily: "inherit",
              transition: "all .18s cubic-bezier(0.16,1,0.3,1)",
            }}
            onMouseEnter={e => { if (!active) { e.currentTarget.style.background = "var(--bg-2)"; } }}
            onMouseLeave={e => { if (!active) { e.currentTarget.style.background = "transparent"; } }}
            >
              <div style={{
                width: 22, height: 22, borderRadius: 6,
                background: isDone ? "var(--ac)" : (active ? "var(--ac)" : "var(--bg-2)"),
                color: isDone || active ? "white" : "var(--tx-4)",
                border: isDone || active ? "none" : `1px solid var(--bd-1)`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 10, fontWeight: 700, fontFamily: "var(--mono)",
                flexShrink: 0,
                transition: "all .15s",
              }}>
                {isDone ? <Icon name="check" size={11} /> : step.idx}
              </div>
              <div style={{ textAlign: "left", lineHeight: 1.3 }}>
                <div style={{ fontSize: 12, fontWeight: active ? 600 : 500, color: active ? "var(--tx-1)" : (isDone ? "var(--tx-2)" : "var(--tx-4)"), letterSpacing: -0.01 }}>{step.name}</div>
              </div>
            </button>
            {!isLast && (
              <div style={{
                flex: 1, height: 2, minWidth: 12,
                background: isDone
                  ? "linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 60%, transparent))"
                  : "var(--bg-3)",
                borderRadius: 1,
                margin: "0 2px",
                transition: "background 0.3s",
              }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
};

Object.assign(window, { Pipeline, PipelineStrip, StepBadge });

</script>

// ── Download helper ──────────────────────────────────────────────────────────
function triggerDownload(content, filename, mimeType = "text/plain") {
  const blob = new Blob([content], { type: mimeType + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

function genStep1MD() {

    lines.push(`### ${c.name}  \n> ${c.url || ""}\n`);

    lines.push(`**可借鉴**：${c.usable || ""}  **不照搬**：${c.avoid || ""}  **影响后续**：${c.impact || ""}\n`);
  });

}

<script type="text/babel">
// Chat — AI conversation panel + streaming

const ChatPanel = ({ stepIdx, onRegenerate }) => {
  const stepName = window.DPData.steps[stepIdx - 1].name;
  const isHiFiStep = stepIdx === 4; // Step 4 = 高保真设计
  const [messages, setMessages] = React.useState([
    {
      role: "system",
      text: isHiFiStep
        ? `高保真设计模式已开启。你可以直接描述想要的修改，例如「改成深色模式」「把按钮颜色换成橙色」——AI 会直接更新设计预览。`
        : `已切换到 Step 0${stepIdx}「${stepName}」。需要我改什么？`,
    },
  ]);
  const [input, setInput] = React.useState("");
  const [thinking, setThinking] = React.useState(false);

  // Reset when step changes
  React.useEffect(() => {
    setMessages([
      {
        role: "system",
        text: stepIdx === 4
          ? `高保真设计模式已开启。你可以直接描述想要的修改，例如「改成深色模式」「把按钮颜色换成橙色」——AI 会直接更新设计预览。`
          : `已切换到 Step 0${stepIdx}「${stepName}」。需要我改什么？`,
      },
    ]);
    setInput("");
  }, [stepIdx, stepName]);

  const send = async () => {
    if (!input.trim() || thinking) return;
    const userMsg = { role: "user", text: input };
    const history = [...messages, userMsg];
    setMessages(history);
    setInput("");
    setThinking(true);

    const stepDesc = window.DPData.steps[stepIdx - 1]?.desc || "";

    let systemPrompt;
    if (isHiFiStep && window.DPData.step6?.html) {
      const currentHtml = window.DPData.step6.html;
      // Truncate if too long to avoid token overflow
      const htmlSnippet = currentHtml.length > 12000
        ? currentHtml.substring(0, 12000) + "\n<!-- ...truncated... -->"
        : currentHtml;
      systemPrompt = `你是 Designpipe 的 AI 设计调整助手，专门服务于转转（二手电商平台）高保真设计稿。

${window.DPDesignSpec}

当前高保真 HTML：
\`\`\`html
${htmlSnippet}
\`\`\`

用户请求视觉/内容修改时（严格按此顺序输出）：
1. 先用一句话（≤30字）说明你将怎么改
2. 紧接着返回**整页完整**的修改后 HTML，用 \`\`\`html ... \`\`\` 包裹，从 <!DOCTYPE html> 开始到 </html> 结束
3. 代码块之后不要再写任何文字
4. 必须返回整页（不是片段、不是 diff），并保留顶部 status-bar（44px）与 nav-bar
5. 严格遵守上方转转设计系统规范，不得使用规范外的颜色或字体

用户只是提问或讨论（不涉及改设计）时：直接用中文回答，不返回任何 HTML 代码。`;
    } else {
      systemPrompt = `你是 Designpipe 的 AI 设计协作助手，正协助完成转转（二手电商平台）的 UX 设计工作流。当前步骤：Step 0${stepIdx}「${stepName}」——${stepDesc}。请根据用户问题给出专业、简洁的设计建议，回复中文，控制在 300 字以内。`;
    }

    const apiMessages = [
      { role: "system", content: systemPrompt },
      ...history
        .filter(m => m.role !== "system")
        .map(m => ({ role: m.role === "ai" ? "assistant" : "user", content: m.text })),
    ];

    try {
      const res = await fetch("http://localhost:8000/api/proxy-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // 高保真修改要返回整页 HTML，给足 token 防止截断
        body: JSON.stringify({ messages: apiMessages, ...(isHiFiStep ? { max_tokens: 16000 } : {}) }),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      setThinking(false);
      setMessages(m => [...m, { role: "ai", text: "", streaming: true }]);

      // 判断流式内容是否"像代码"（HTML 标签 / 代码围栏 / CSS 规则）
      const looksLikeCode = (t) => (
        /```|<!doctype|<html|<head|<body|<style|<div|<section|<button|<span|<input|<img|<svg|<nav|<ul|<li/i.test(t)
        || /\{[^{}]*:[^{}]*;/.test(t)
      );

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let aiText = "";
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const chunk = line.slice(6);
          if (chunk === "[DONE]") break;
          try {
            const parsed = JSON.parse(chunk);
            aiText += parsed.content || "";
            const live = aiText;
            setMessages(m => m.map((msg, i) => {
              if (i !== m.length - 1) return msg;
              // 高保真步骤：只要内容"像代码"，聊天里就不刷代码，只显示生成中占位
              let disp = live;
              if (isHiFiStep && looksLikeCode(live)) {
                disp = "⏳ 正在生成新的设计，请稍候…（结果会直接更新左侧预览）";
              }
              return { ...msg, text: disp };
            }));
          } catch (_) {}
        }
      }
      setMessages(m => m.map((msg, i) => i === m.length - 1 ? { ...msg, streaming: false } : msg));

      // After streaming: check if AI returned HTML for hi-fi update
      if (isHiFiStep) {
        // 容错提取：兼容 ```html 配对、裸 HTML、以及被 MAX_TOKENS 截断（无结尾）的情况
        const extractHtml = (text) => {
          // 1) 配对的 ```html ... ```
          let m = text.match(/```html\s*([\s\S]*?)```/i);
          if (m && m[1].trim().length > 200) return m[1].trim();
          // 2) 完整 <!DOCTYPE ... </html> 或 <html ... </html>
          m = text.match(/<!DOCTYPE[\s\S]*<\/html>/i) || text.match(/<html[\s\S]*<\/html>/i);
          if (m) return m[0].trim();
          // 3) 截断：只有开头没有结尾，从 HTML 起点截到末尾再补全标签
          let start = text.search(/<!DOCTYPE/i);
          if (start === -1) start = text.search(/<html[\s>]/i);
          if (start === -1) { const f = text.search(/```html/i); if (f !== -1) start = f; }
          if (start !== -1) {
            let html = text.slice(start)
              .replace(/```html\s*/i, "")
              .replace(/```\s*$/i, "")
              .trim();
            if (html.length < 200) return null;
            if (!/<\/body>/i.test(html)) html += "\n</body>";
            if (!/<\/html>/i.test(html)) html += "\n</html>";
            return html;
          }
          return null;
        };
        const rawHtml = extractHtml(aiText);
        if (rawHtml) {
          try {
            const processed = window.DPPostProcessHtml(rawHtml);
            window.DPData.step6 = { html: processed };
            window.dispatchEvent(new CustomEvent('updateContent'));
            // 取 HTML 之前的文字作为说明（说明通常在代码块之前一句）
            let cut = aiText.search(/```html|<!DOCTYPE|<html[\s>]/i);
            let explanation = (cut !== -1 ? aiText.slice(0, cut) : aiText)
              .replace(/```html?\s*$/i, "").trim();
            setMessages(m => m.map((msg, i) => i === m.length - 1
              ? { ...msg, text: (explanation || "已按你的要求更新设计。") + "\n\n✅ 左侧预览已刷新", streaming: false, htmlApplied: true }
              : msg
            ));
          } catch (e) {
            console.error("Chat HTML apply error:", e);
            setMessages(m => m.map((msg, i) => i === m.length - 1
              ? { ...msg, text: "⚠️ 更新预览时出错了，请重试或换一种说法。", streaming: false }
              : msg
            ));
          }
        } else if (looksLikeCode(aiText)) {
          // AI 输出了代码但无法提取出完整页面（多半被截断）——不要把代码留在聊天里
          setMessages(m => m.map((msg, i) => i === m.length - 1
            ? { ...msg, text: "⚠️ 这次没能生成完整页面（可能被截断），请再说一次，或把需求拆小一点重试。", streaming: false }
            : msg
          ));
        }
      }

    } catch (err) {
      setThinking(false);
      setMessages(m => [...m, { role: "ai", text: "⚠️ 无法连接 AI 服务，请确认 Designpipe 后端正在运行（端口 8000）。" }]);
    }
  };

  const suggestions = window.DPChatSuggestions[stepIdx] || window.DPChatSuggestions.default;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      {/* Header */}
      <div style={{
        padding: "14px 16px", borderBottom: "1px solid var(--bd-1)",
        display: "flex", alignItems: "center", gap: 8,
      }}>
        <div style={{
          width: 26, height: 26, borderRadius: 8,
          background: "var(--ac-soft)", color: "var(--ac)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}><Icon name="sparkles" size={14} /></div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>
            {isHiFiStep ? "设计调整模式" : `AI 协作 · Step 0${stepIdx}`}
            {isHiFiStep && (
              <span style={{
                marginLeft: 6, fontSize: 10, fontWeight: 500,
                padding: "1px 6px", borderRadius: 4,
                background: "var(--ac-soft)", color: "var(--ac)",
              }}>实时更新</span>
            )}
          </div>
          <div style={{ fontSize: 11, color: "var(--tx-4)" }}>
            {isHiFiStep ? "描述修改需求，AI 直接更新高保真预览" : "对当前步骤改写、补充、追问"}
          </div>
        </div>
        <Btn variant="ghost" size="sm" icon="regenerate" onClick={onRegenerate} title="重新生成本步骤">重生</Btn>
        <Btn variant="ghost" size="sm" icon="x" onClick={() => window.dispatchEvent(new CustomEvent('closeChat'))} title="关闭" />
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: "auto", padding: "16px", display: "flex", flexDirection: "column", gap: 14 }}>
        {messages.map((m, i) => <Message key={i} m={m} />)}
        {thinking && (
          <div style={{ display: "flex", gap: 8, color: "var(--tx-3)", fontSize: 12 }}>
            <div style={{
              width: 22, height: 22, borderRadius: 6, background: "var(--ac-soft)", color: "var(--ac)",
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
            }}><Icon name="sparkles" size={12} /></div>
            <div className="pulse">思考中…</div>
          </div>
        )}
      </div>

      {/* Suggestions */}
      <div style={{ padding: "0 16px 12px", display: "flex", flexWrap: "wrap", gap: 6 }}>
        {suggestions.map((s, i) => (
          <button key={i} onClick={() => { setInput(s); }} style={{
            fontSize: 11.5, padding: "5px 10px", borderRadius: 999,
            border: "1px solid var(--bd-1)", background: "var(--bg-1)",
            color: "var(--tx-2)", cursor: "pointer", fontFamily: "inherit",
            transition: "all .15s",
          }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--ac-line)"; e.currentTarget.style.color = "var(--ac)"; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--bd-1)"; e.currentTarget.style.color = "var(--tx-2)"; }}
          >{s}</button>
        ))}
      </div>

      {/* Input */}
      <div style={{
        margin: "0 12px 12px", padding: "10px 12px",
        background: "var(--bg-2)", border: "1px solid var(--bd-1)",
        borderRadius: 10, display: "flex", flexDirection: "column", gap: 8,
      }}>
        <textarea
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } }}
          placeholder="让 AI 改写 / 补充 / 重生成…  ⌘ + ↵ 发送"
          rows={2}
          style={{
            width: "100%", background: "transparent", border: "none", outline: "none",
            resize: "none", color: "var(--tx-1)", fontFamily: "inherit", fontSize: 13, lineHeight: 1.5,
          }}
        />
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <Btn variant="ghost" size="sm" icon="attach" title="附加文件" />
          <Btn variant="ghost" size="sm" icon="wand" title="改写">改写</Btn>
          <div style={{ flex: 1 }} />
          <span className="mono" style={{ fontSize: 10, color: "var(--tx-4)" }}>Claude · Haiku 4.5</span>
          <Btn variant="primary" size="sm" icon="send" onClick={send} disabled={!input.trim()}>发送</Btn>
        </div>
      </div>
    </div>
  );
};

const Message = ({ m }) => {
  const isUser = m.role === "user";
  const isAI = m.role === "ai";
  const { shown, done } = useTypewriter(m.text, { enabled: m.typing, speed: 14 });
  const display = m.typing ? shown : m.text;
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }} className="fadeUp">
      {!isUser && (
        <div style={{
          width: 22, height: 22, borderRadius: 6, flexShrink: 0,
          background: isAI ? "var(--ac-soft)" : "var(--bg-2)",
          color: isAI ? "var(--ac)" : "var(--tx-3)",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}><Icon name={isAI ? "sparkles" : "info"} size={12} /></div>
      )}
      <div style={{
        flex: 1, minWidth: 0,
        background: isUser ? "var(--ac-soft)" : "transparent",
        border: isUser ? "1px solid var(--ac-line)" : "none",
        borderRadius: 10, padding: isUser ? "8px 12px" : 0,
        marginLeft: isUser ? 28 : 0,
        fontSize: 12.5, color: isUser ? "var(--tx-1)" : "var(--tx-2)", lineHeight: 1.55,
      }}
      className={m.typing && !done ? "tcursor" : ""}
      >
        {display}
      </div>
      {isUser && (
        <div style={{
          width: 22, height: 22, borderRadius: 6, flexShrink: 0,
          background: "var(--bg-3)", color: "var(--tx-2)", fontSize: 10, fontWeight: 600,
          display: "flex", alignItems: "center", justifyContent: "center",

    </div>

};

<script type="text/babel">
// Kickoff screen — AI greeting + project setup before entering workflow

// 工具函数：将 Q&A 答案拼成 prompt 上下文字符串（全局可用）
function buildQAContext() {
  const qa = window.DPData.qa || [];
  const lines = qa.filter(q => q.answer && q.answer.trim()).map(q => `· ${q.question}：${q.answer}`);
  return lines.length ? `\n\n【用户补充信息（来自项目问答）】\n${lines.join("\n")}` : "";
}

const Kickoff = ({ project, onStart, onBack }) => {
  const [phase, setPhase] = React.useState("greeting");
  const [input, setInput] = React.useState("");
  const [thinking, setThinking] = React.useState(false);
  const [loadingMsg, setLoadingMsg] = React.useState("");
  const [projectBrief, setProjectBrief] = React.useState(null);
  const [attachments, setAttachments] = React.useState([]);
  const [pageImage, setPageImage] = React.useState(null);
  const [questions, setQuestions] = React.useState([]);   // AI 生成的问题列表
  const [answers, setAnswers] = React.useState({});        // { q1: "选项A", ... }
  const [apiError, setApiError] = React.useState(null);   // { code, msg }
  const fileInputRef = React.useRef(null);

  // Call local AI proxy and collect full streamed JSON response
  const callAI = async (prompt) => {
    const res = await fetch("http://localhost:8000/api/proxy-chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "", buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const chunk = line.slice(6);
        if (chunk === "[DONE]") break;
        try {
          const content = JSON.parse(chunk).content || "";
          // Check for backend error signal
          if (content.startsWith("__ERROR__")) {
            const rest = content.slice(9); // strip "__ERROR__"
            const sep = rest.indexOf("::");
            const code = sep !== -1 ? rest.slice(0, sep) : rest;
            const msg = sep !== -1 ? rest.slice(sep + 2) : rest;
            const err = new Error(msg);
            err.code = code;
            throw err;
          }
          full += content;
        } catch (e) {
          if (e.code !== undefined) throw e; // re-throw our errors
        }
      }
    }
    // Robust extraction — strip markdown fences, fix trailing commas
    let t = full.replace(/```(?:json)?\s*\n?([\s\S]*?)\n?```/g, '$1').trim();
    const start = t.indexOf('{'); const end = t.lastIndexOf('}');
    if (start !== -1 && end !== -1) {
      const raw = t.slice(start, end + 1).replace(/,(\s*[}\]])/g, '$1');
      try { return JSON.parse(raw); } catch {}
    }
    const m = full.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch {} }
    throw new Error("No JSON in response");
  };

  const handleFileChange = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      if (file.type.startsWith("image/") && !pageImage) {
        const reader = new FileReader();
        reader.onload = (ev) => setPageImage(ev.target.result);
        reader.readAsDataURL(file);
      }
    });
    setAttachments(prev => [...prev, ...files]);
  };

  const removeAttachment = (idx) => {
    const file = attachments[idx];
    if (file && file.type.startsWith("image/")) setPageImage(null);
    setAttachments(prev => prev.filter((_, i) => i !== idx));
  };

  const handleGreetingSubmit = async () => {
    if (!input.trim() || thinking) return;
    setThinking(true);

    // ── Step 1: parse brief ──
    setLoadingMsg("理解项目背景…");
    let brief = { product: input.slice(0, 24), targetUser: "目标用户", goal: "优化用户体验", context: "移动端应用" };

      );
      if (b && b.product) { brief = b; setApiError(null); }
    } catch (e) {
      console.error("[Kickoff] brief 解析失败:", e);
      const isQuota = e.code === "insufficient_quota" || (e.message || "").includes("配额");
      if (isQuota) {
        setApiError({ code: "insufficient_quota", msg: e.message });
        setLoadingMsg(""); setThinking(false);
        return; // stop here, show recharge banner
      }

    setProjectBrief({ userInput: input, ...brief });

      );
      if (Array.isArray(cr.options) && cr.options.length) competitorOptions = cr.options.slice(0, 6);
    } catch (e) {
      console.warn("[Kickoff] 竞品推荐失败:", e.message);

      );
      qs = Array.isArray(q.questions) ? q.questions : [];
    } catch (e) {
      console.error("[Kickoff] 问题生成失败:", e);

    };
    const allQuestions = [compCard, ...qs];

    setLoadingMsg("");
    setThinking(false);
    setPhase(allQuestions.length > 0 ? "questioning" : "confirming");
  };

  const handleQuestionsSubmit = () => {
    const qa = questions.map(q => {
      const raw = answers[q.id];
      let answer = "";

}

产品：${projectBrief?.product || input}

  (window.DPData.chosenCompetitors || []).length

<script type="text/babel">
// Workflow shell — main layout for an opened project

const Workflow = ({ projectId, skipKickoff, onBack, onProjectUpdate, chatOpen, setChatOpen }) => {
  const project = window.DPData.projects.find(p => p.id === projectId);
  // null = Kickoff; if skipKickoff, start at project's saved step (min 1)
  // Restore workflow state from cache if available
  const _cachedWF = React.useMemo(() => window.dpLoadWorkflowState(), []);
  const _hasCachedSteps = !!(
    window.DPData.step1?.competitors?.length ||
    window.DPData.step2?.diagnosis ||
    window.DPData.step4?.directions?.length ||
    window.DPData.step6?.html
  );
  const [currentStep, setCurrentStep] = React.useState(() => {
    if (skipKickoff) {
      // Use cached state if available, fallback to project.currentStep
      const cached = _cachedWF?.currentStep;
      const fromProject = project?.currentStep;
      return Math.max(1, cached || fromProject || 1);
    }
    if (_hasCachedSteps && _cachedWF?.currentStep) return _cachedWF.currentStep;
    return null;
  });
  const [completedStep, setCompletedStep] = React.useState(() => {
    if (skipKickoff) {
      const cached = _cachedWF?.completedStep;
      const fromProject = project?.completedStep ?? (project?.currentStep ? project.currentStep - 1 : 0);
      return cached ?? fromProject ?? 0;
    }
    return _hasCachedSteps && _cachedWF?.completedStep ? _cachedWF.completedStep : 0;
  });
  const [runningStep, setRunningStep] = React.useState(null);
  const [chosenDirection, setChosenDirection] = React.useState(
    (_cachedWF?.chosenDirection) || project.direction
  );
  const [pipelineHidden, setPipelineHidden] = React.useState(false);
  const [contentVersion, setContentVersion] = React.useState(0); // trigger content update
  const [errorMsg, setErrorMsg] = React.useState(null);
  const [progressMsg, setProgressMsg] = React.useState(null);
  const [genLabel, setGenLabel] = React.useState("");
  const scrollRef = React.useRef(null);

  // Listen for chat close event
  React.useEffect(() => {
    const handler = () => setChatOpen(false);
    window.addEventListener('closeChat', handler);
    return () => window.removeEventListener('closeChat', handler);
  }, [setChatOpen]);

  // Listen for content update from chat
  React.useEffect(() => {
    const handler = (e) => {
      setContentVersion(v => v + 1);
      setRunningStep(currentStep);
      setTimeout(() => setRunningStep(null), 1800);
    };
    window.addEventListener('updateContent', handler);
    return () => window.removeEventListener('updateContent', handler);
  }, [currentStep]);

  // Hide pipeline on scroll down
  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    let lastY = el.scrollTop;
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const currentY = el.scrollTop;
          const delta = currentY - lastY;
          
          // Only toggle if scrolled significantly (prevents jitter)
          if (Math.abs(delta) > 5) {
            if (currentY > 100 && delta > 0) {
              setPipelineHidden(true);
            } else if (delta < 0 && currentY < 50) {
              setPipelineHidden(false);
            }
          }
          
          lastY = currentY;
          ticking = false;
        });
        ticking = true;
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, []);

  // Show kickoff on first load
  if (currentStep === null) {
    return window.Kickoff 
      ? <window.Kickoff project={project} onBack={onBack} onStart={(step) => {
            // After Kickoff, update project with real brief info
            const s1 = window.DPData.step1 || {};
            const brief = window.DPData._lastBrief || {};
            const product = brief.product || s1.objective?.replace(/^围绕「/, "").replace(/」.*$/, "") || project.title;
            const title = product + (brief.goal ? "·" + brief.goal.slice(0, 10) : "");
            if (onProjectUpdate) onProjectUpdate(projectId, {
              title,
              product: brief.product || "",
              targetUser: brief.targetUser || "",
              currentStep: step,
              completedStep: step - 1,
              status: "进行中",
              updatedAt: "刚刚",
              color: project.color || "#cc785c",
              tag: brief.product ? brief.product.slice(0, 4) : "新建",
            });
            setCurrentStep(step);
          }} />
      : null;
  }

  const step = window.DPData.steps[currentStep - 1];

  // Robust JSON extractor — handles markdown code blocks & trailing commas
  const extractJSON = (text) => {
    // Strip markdown fences — handle both complete (```...```) and truncated (``` with no closing)
    let t = text
      .replace(/```(?:json|JSON)?\s*\n?/g, '')  // strip opening fence
      .replace(/\n?```\s*$/g, '')                // strip closing fence if present
      .trim();
    const start = t.indexOf('{');
    if (start === -1) return null;
    // Try progressively shorter slices if JSON is truncated
    const tries = [t.lastIndexOf('}'), t.lastIndexOf('},'), t.lastIndexOf('"}')];
    for (const end of tries) {
      if (end <= start) continue;
      let raw = t.slice(start, end + 1);
      raw = raw.replace(/,(\s*[}\]])/g, '$1');  // trailing commas
      try { return JSON.parse(raw); } catch {}
    }
    // Aggressive: scan backwards for a valid JSON object
    for (let i = t.length - 1; i > start; i--) {
      if (t[i] !== '}') continue;
      let raw = t.slice(start, i + 1);
      raw = raw.replace(/,(\s*[}\]])/g, '$1');
      try { return JSON.parse(raw); } catch {}
    }
    return null;
  };

  // Call AI proxy and collect full streamed response
  const aiJSON = async (prompt, image, timeoutMs = 120000) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const body = { messages: [{ role: "user", content: prompt }] };
    if (image) body.image = image;
    let res;
    try {
      res = await fetch("http://localhost:8000/api/proxy-chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
    } catch (e) {
      clearTimeout(timer);
      if (e.name === "AbortError") throw new Error("AI 响应超时（超过 120 秒），请重试");
      throw new Error(`网络错误：${e.message}，请确认 Designpipe 后端正在运行`);
    }
    if (!res.ok) { clearTimeout(timer); throw new Error(`HTTP ${res.status}`); }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "", buf = "";
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const chunk = line.slice(6);
          if (chunk === "[DONE]") break;
          try {
            const content = JSON.parse(chunk).content || "";
            if (content.startsWith("__ERROR__")) {
              const rest = content.slice(9);
              const sep = rest.indexOf("::");
              const code = sep !== -1 ? rest.slice(0, sep) : rest;
              const msg = sep !== -1 ? rest.slice(sep + 2) : rest;
              const err = new Error(msg); err.code = code; throw err;
            }
            full += content;
          } catch (e) { if (e.code !== undefined) throw e; }
        }
      }
    } catch (e) {
      if (e.name !== "AbortError") { clearTimeout(timer); throw e; }
    }
    clearTimeout(timer);
    const parsed = extractJSON(full);
    if (!parsed) throw new Error(`JSON解析失败，原始回复：${full.slice(0, 200)}`);
    return parsed;
  };

  // Collect full streamed text (for HTML generation)
  const aiText = async (prompt, image, signal, maxTokens) => {
    const body = { messages: [{ role: "user", content: prompt }] };
    if (image) body.image = image;
    if (maxTokens) body.max_tokens = maxTokens;
    const res = await fetch("http://localhost:8000/api/proxy-chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: signal || null,
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "", buf = "";
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const chunk = line.slice(6);
          if (chunk === "[DONE]") break;
          try {
            const content = JSON.parse(chunk).content || "";
            if (content.startsWith("__ERROR__")) {
              const rest = content.slice(9);
              const sep = rest.indexOf("::");
              const code = sep !== -1 ? rest.slice(0, sep) : rest;
              const msg = sep !== -1 ? rest.slice(sep + 2) : rest;
              const err = new Error(msg); err.code = code; throw err;
            }
            full += content;
          } catch (e) { if (e.code !== undefined) throw e; }
        }
      }
    } catch (e) {
      // AbortError or network error mid-stream — return whatever we got so far
      if (e.name !== "AbortError") throw e;
    }
    return full;
  };

  const confirmStep = async () => {
    const newCompleted = currentStep > completedStep ? currentStep : completedStep;
    if (currentStep > completedStep) setCompletedStep(newCompleted);
    if (currentStep >= 5) return;
    const nextStep = currentStep + 1;
    // Steps 1, 2, 4 need AI generation for the next step's content
    if (currentStep === 1 || currentStep === 2 || currentStep === 3 || currentStep === 4) {
      await generateForStep(currentStep);
    }
    setCurrentStep(nextStep);
    // Persist navigation state so refresh returns to same step
    window.dpSaveWorkflowState({ currentStep: nextStep, completedStep: newCompleted, chosenDirection });
    // Update project card in home list
    if (onProjectUpdate) onProjectUpdate(projectId, {
      currentStep: nextStep,
      completedStep: newCompleted,
      updatedAt: "刚刚",
      status: nextStep >= 5 ? "已交付" : "进行中",
    });
  };

  const generateForStep = async (step) => {
    const s1 = window.DPData.step1 || {};
    const s2 = window.DPData.step2 || {};
    const brief = `分析目标：${s1.objective || ""}\n设计输入：${(s1.inputs || []).slice(0,3).join("；")}`;

/* ===== ZHUAN RESET ===== */
*, *::before, *::after {
  box-sizing: border-box !important;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html { width: 390px; max-width: 390px; overflow: hidden; }
body {
  width: 390px; max-width: 390px; height: 844px;
  overflow: hidden;
  font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #FFFFFF;  /* 转转列表页白底，不是#F8F8F8 */
  -webkit-font-smoothing: antialiased;
  font-weight: 300;  /* 转转默认字重 Light */
}
div, section, header, footer, nav, main, ul, li { max-width: 100%; }
img, svg { display: block; max-width: 100%; }
button { border: none; cursor: pointer; font-family: inherit; background: none; }
a { text-decoration: none; color: inherit; }
/* 价格强制黑色 */
.price, [class*="price"] { color: #111111 !important; }
/* ===== END RESET ===== */

  orange:  { light: ["#cc785c", "#b8654a"], swatch: "#cc785c" },
  cyan:    { light: ["#2a9fdb", "#1d89c4"], swatch: "#2a9fdb" },
  violet:  { light: ["#8b5cf6", "#7c3aed"], swatch: "#8b5cf6" },
  green:   { light: ["#4a9d6f", "#3d8b5f"], swatch: "#4a9d6f" },
};
const SWATCH_TO_ACCENT = Object.fromEntries(Object.entries(ACCENT_PALETTES).map(([k, v]) => [v.swatch, k]));

const App = () => {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const [route, setRoute] = React.useState({ view: "home" });
  const [chatOpen, setChatOpen] = React.useState(t.chatOpen);
  const [projects, setProjects] = React.useState(window.DPData.projects);

  // Apply tweaks → root data-attrs and CSS vars
  React.useEffect(() => {
    document.documentElement.dataset.density = t.density;
    document.documentElement.dataset.font = t.font;

    const pal = ACCENT_PALETTES[t.accent] || ACCENT_PALETTES.orange;
    const [ac, ac2] = pal.light;
    const root = document.documentElement;
    root.style.setProperty("--ac", ac);
    root.style.setProperty("--ac-2", ac2);
  }, [t.density, t.font, t.accent]);

  // Open existing project → skip Kickoff, go directly to saved step
  const openProject = (id) => {
    const p = projects.find(x => x.id === id);
    const hasProgress = p && p.currentStep > 0 && p.status !== "草稿";
    setRoute({ view: "workflow", projectId: id, skipKickoff: hasProgress });
  };

  // New project → create a temp project, show Kickoff for it
  const newProject = () => {
    const id = "proj_" + Date.now();
    const newP = {
      id,
      title: "新设计项目",
      product: "",
      targetUser: "",
      scenario: "",
      style: "通用风格",
      cover: "new",
      currentStep: 0,
      maxStep: 5,
      direction: null,
      updatedAt: "刚刚",
      collaborators: [],
      status: "草稿",
      tag: "新建",
    };
    // Register in DPData so Workflow can find it
    window.DPData.projects = [...projects, newP];
    setProjects(window.DPData.projects);
    setRoute({ view: "workflow", projectId: id, skipKickoff: false });
  };

  // Called by Workflow when Kickoff completes or step advances
  const onProjectUpdate = (id, updates) => {
    setProjects(prev => {
      const next = prev.map(p => p.id === id ? { ...p, ...updates } : p);
      window.DPData.projects = next;
      // Persist user projects (exclude demo)
      window.dpSaveProjects(next.filter(p => p.id !== "iphone15"));
      return next;
    });
  };

  const goHome = () => setRoute({ view: "home" });

  return (
    <>
      {route.view === "home"
        ? <Home onOpenProject={openProject} onNewProject={newProject}
            projects={projects} setProjects={setProjects} />
        : <Workflow projectId={route.projectId} skipKickoff={route.skipKickoff}
            onBack={goHome} onProjectUpdate={onProjectUpdate}
            chatOpen={chatOpen} setChatOpen={setChatOpen} />
      }

      <TweaksPanel title="Tweaks">
        <TweakSection label="主题">
          <TweakColor
            label="强调色"
            value={ACCENT_PALETTES[t.accent].swatch}
            onChange={hex => setTweak("accent", SWATCH_TO_ACCENT[hex] || "orange")}
            options={Object.values(ACCENT_PALETTES).map(p => p.swatch)}
          />
        </TweakSection>
        <TweakSection label="排版">
          <TweakRadio
            label="字体"
            value={t.font}
            onChange={v => setTweak("font", v)}
            options={[{ value: "sans", label: "Sans" }, { value: "serif", label: "Serif" }]}
          />
          <TweakRadio
            label="密度"
            value={t.density}
            onChange={v => setTweak("density", v)}
            options={[{ value: "compact", label: "紧凑" }, { value: "comfortable", label: "舒适" }]}
          />
        </TweakSection>
        <TweakSection label="布局">
          <TweakToggle
            label="AI 协作面板"
            value={chatOpen}
            onChange={v => { setChatOpen(v); setTweak("chatOpen", v); }}
          />
        </TweakSection>
        <TweakSection label="跳转">
          <TweakButton label="回到项目列表" onClick={() => setRoute({ view: "home" })} />
          <TweakButton label="进入示例项目" onClick={() => setRoute({ view: "workflow", projectId: "iphone15" })} secondary />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
